server {
    listen 80;
    listen [::]:80;
    server_name admin.plum.top;

    access_log /var/log/nginx/admin.plum.top.access.log admin_sanitized;
    error_log /var/log/nginx/admin.plum.top.error.log;
    server_tokens off;
    client_max_body_size 10m;

    # Certbot upgrades this vhost to TLS and adds a separate HTTP redirect server.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # connect-src must list the media bucket: character import unpacks the package in the
    # browser and uploads portraits straight to S3. Without that origin the browser refuses
    # the request BEFORE sending it, so neither S3 nor the backend records anything at all —
    # the console just shows "portraits 0 / N, N failed" with no cause anywhere (2026-09-07).
    # Bucket CORS is necessary but not sufficient; CSP is evaluated first.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; connect-src 'self' https://plum-prod-media-071975551771.s3.ap-southeast-1.amazonaws.com; upgrade-insecure-requests" always;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # These values are trusted by the application when it creates public redirects.
        # Always overwrite client-supplied forwarded headers at this boundary.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
